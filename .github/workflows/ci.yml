name: CI

on:
  pull_request:
    branches: [main, feat/voyage-embeddings]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci
      - name: Type check
        run: npm run type:check
      - name: Lint check
        run: npm run lint:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  windows-cli:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci
      - name: Test Windows CLI execution
        run: npx jest --runInBand src/core/cli/cli.test.ts src/core/cli/windows.test.ts
