name: CI

on:
  pull_request:
    branches: [main, feat/voyage-embeddings]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '20'
      - run: npm ci
      - name: Type check
        run: npm run type:check
      - name: Lint check
        run: npm run lint:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  windows-cli:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '20'
      - run: npm ci
      - name: Test Windows CLI execution
        run: npx jest --runInBand src/core/cli/cli.test.ts src/core/cli/windows.test.ts
